# ------------------------------------------------------------------ #
# Render blueprint — a preview link in one commit
#
# Render reads this file when you point it at the repository ("New →
# Blueprint"), creates both the web service and the database, and wires
# DATABASE_URL between them. Nothing here needs editing before it works;
# the four values marked sync:false are the ones Render will ask you for.
#
# The same shape works on Railway, Fly, Koyeb or any host that can run a
# Node process — see DEPLOY.md. The Dockerfile beside this file is there
# for the ones that prefer a container.
# ------------------------------------------------------------------ #

databases:
  - name: tls-db
    databaseName: tls
    # Was `free`. Free Postgres is deleted 30 days after creation, with a
    # 14-day grace period after that — a clock a live directory cannot sit
    # under. 0.1c-256mb ($6) also clears that clock and briefly held this
    # spot, but this is 0.5 CPU / 1 GB ($19), chosen for the launch window
    # rather than for the size of the data.
    #
    # The data itself is small: 2,441 listings, and the searches over them
    # are cheap. What is not small is the crawl. When DNS moves, Google
    # re-crawls the whole site to process data/redirects.csv — 2,733 301s
    # and 17 410s — and decides whether the old domain's rankings follow.
    # That is thousands of page requests, each one a query, sustained over
    # days. 256 MB is thin for it: Postgres wants ~50 MB to exist, plus
    # shared buffers, plus 5-10 MB per pooled connection, and this app
    # opens nine at boot. 0.1 CPU is burstable, not dedicated, so sustained
    # load is the shape it handles worst.
    #
    # The cost of being wrong is asymmetric. Googlebot slows its crawl rate
    # when it meets slow responses, which stretches out the very redirect
    # processing the migration depends on. $13/month is a cheap hedge
    # against a ranking transfer taking months instead of weeks.
    #
    # Revisit ~60 days after cutover, once the Metrics tab shows real
    # numbers. If memory and CPU sit well under the ceiling, 0.1c-256mb is
    # the honest plan and saves $156/year. Resizing either way is a
    # ~45-second restart with no data loss.
    plan: 0.5c-1g
    postgresMajorVersion: "16"
    # Must match the web service's region. DATABASE_URL uses the
    # database's internal hostname, and internal hostnames only resolve
    # within one region — a database left on the default region while
    # the service sits in Frankfurt fails at boot with
    # "getaddrinfo ENOTFOUND dpg-…", which reads like a broken
    # connection string and is actually a geography problem.
    region: frankfurt

services:
  - type: web
    name: tls-preview
    runtime: node
    # Was `free`. Free web services spin down after 15 minutes idle and
    # take about a minute to wake. On a preview link that is a shrug; on
    # a domain Google already ranks it is a ranking problem, because
    # Googlebot meets the wake screen, not the page.
    plan: 0.5c-512mb
    region: frankfurt # closest to a UK audience
    branch: main
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"

      # Baked into the frontend bundle at build time. Without it the
      # built site calls http://localhost:4000/api and every panel on
      # the deployed page comes back empty — the site renders, and
      # nothing in it works. A relative path keeps it on whatever
      # origin the page was served from, which is this same service.
      - key: VITE_API_URL
        value: /api

      - key: DATABASE_URL
        fromDatabase:
          name: tls-db
          property: connectionString

      # Signs every session token. Render generates it once and keeps it
      # — regenerating would sign everybody out on each deploy.
      - key: AUTH_SECRET
        generateValue: true

      # A preview is not a search result. STAGING adds noindex headers
      # and a robots.txt that disallows everything.
      #
      # Now "0", for the live domain. This alone does NOT open the site:
      # app.js reads STAGING === "1" || Boolean(SITE_PASSWORD), so the
      # noindex headers and the gate both stay on until SITE_PASSWORD is
      # also deleted in the Render dashboard. Two switches, deliberately
      # — neither one can drop the site into Google by itself.
      - key: STAGING
        value: "0"

      # The shared password for the link you send the client. Set this in
      # the Render dashboard — anyone with the URL and this password can
      # see the preview, and nobody else can.
      - key: SITE_PASSWORD
        sync: false
      - key: SITE_USER
        value: client

      # OFF. This seeded a demo directory into an empty database, which was
      # right for the first preview and is wrong now: a fresh deployment is
      # restored from a pg_dump of the real data, and a seed running first
      # puts 8 demo listings in the way of that restore.
      - key: SEED_ON_BOOT
        value: "0"

      # The admin login for the preview. Set both before the first
      # deploy, or the seed falls back to admin@tls.test / demo1234.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

      # Where the site is reachable — used by email links, the sitemap
      # and every uploaded-photo URL.
      #
      # Deliberately NOT set here. These were filled from
      # `fromService: property: host`, which returns the service NAME:
      # PUBLIC_API_URL became "tls-preview", and every photo uploaded on
      # this deployment came back as "tls-preview/uploads/photo.jpg" — a
      # relative path that resolves against whatever page the browser is
      # on and 404s. Broken images on every profile, and a validation
      # error the moment anyone saved a form holding one.
      #
      # Render sets RENDER_EXTERNAL_URL on every web service, and it is
      # the real public address including the scheme. The API reads it
      # (see lib/storage.js) and falls back to the host the request
      # arrived on, which on a single-origin deployment is correct
      # anyway. Set PUBLIC_API_URL by hand only if the API is ever
      # served from a different domain than the site.

      # Email: live through Resend. The domain toplocalspecialists.com is
      # verified in Resend (DKIM, SPF and DMARC records live at Namecheap)
      # — removing any of those records breaks sending, not just
      # verification.
      #
      # MAIL_PROVIDER belongs here rather than in the dashboard: a value
      # defined in this file is blueprint-managed, so a dashboard edit is
      # reverted on the next sync and mail drops back to log-only with
      # nothing in the logs to say why.
      - key: MAIL_PROVIDER
        value: resend

      - key: MAIL_FROM
        value: Top Local Specialists <no-reply@toplocalspecialists.com>

      # Set in the Render dashboard. Never in this file, never in git.
      - key: RESEND_API_KEY
        sync: false

      # Safety net while testing: set this in the dashboard to your own
      # address and every message goes there instead of the real
      # recipient. Remove it once a real send is confirmed.
      - key: MAIL_REDIRECT_TO
        sync: false
