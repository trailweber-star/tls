<!doctype html>
<html lang="en-GB" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Cropped to the mark inside the logo badge: the full roundel's ring
         text is illegible below about 64px, so the favicon uses the hand
         and crescent alone, which still reads as the brand at 16px. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0d9488" />

    <!-- Only the title is declared here, as the pre-hydration placeholder;
         React replaces it. Description, robots, canonical and the social
         tags are deliberately NOT here: React 19 hoists metadata but does
         not de-duplicate it, so a static tag with the same name would sit
         alongside every page's own and win any single-element lookup.
         Every route emits its own through components/Seo.tsx. -->
    <title>Top Local Specialists</title>
    <meta property="og:locale" content="en_GB" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
